[project]
name = "rankflow"
version = "0.1.0"
description = "Point-in-time data foundations for RankFlow"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rankflow*"]
