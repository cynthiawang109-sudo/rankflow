[project]
name = "rankflow"
version = "0.1.0"
description = "Point-in-time session ranking for RankFlow"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0.2,<7",
    "psutil>=7,<8",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "psycopg[binary]>=3.2,<4",
    "lightgbm>=4.6,<5",
    "scikit-learn>=1.6,<2",
]

[dependency-groups]
dev = ["httpx>=0.28,<1"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rankflow*"]

[tool.setuptools.package-data]
rankflow = ["playground.html"]
